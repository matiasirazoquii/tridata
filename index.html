<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S!MPLO IVECO - Edición Iveco Only</title>
<style>
:root{--red:#c41212;--dark:#1a1a1a;--gray:#2a2a2a;--light:#e5e5e5;--yellow:#ffcc00}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Roboto,Arial}
body{background:#111;color:#eee;display:flex;height:100vh}
#sidebar{width:300px;background:var(--dark);border-right:2px solid var(--red);display:flex;flex-direction:column}
#logo{background:var(--red);padding:15px;text-align:center;font-weight:900;letter-spacing:2px;font-size:20px}
#search{padding:10px}
#search input{width:100%;padding:10px;background:#222;border:1px solid #444;color:#fff;border-radius:4px}
#models{overflow-y:auto;flex:1}
.model{padding:10px 15px;border-bottom:1px solid #222;cursor:pointer}
.model:hover{background:#222}
.model b{color:var(--yellow);font-size:13px;display:block}
.model span{font-size:11px;color:#999}
.model.active{background:var(--red);color:#fff}
.model.active span{color:#fff}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--gray);padding:10px 20px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #333}
.tab{padding:8px 16px;background:#333;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600}
.tab.active{background:var(--red);color:#fff}
#content{flex:1;overflow-y:auto;padding:20px;background:#0e0e0e}
.card{background:#1e1e1e;border:1px solid #333;border-radius:8px;padding:15px;margin-bottom:15px}
.card h3{color:var(--yellow);margin-bottom:10px;font-size:14px;text-transform:uppercase;letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#222;color:#aaa;padding:8px;text-align:left}
td{padding:7px 8px;border-bottom:1px solid #222}
.pin-c{background:#c41212;color:#fff;padding:2px 6px;border-radius:4px;font-size:11px}
.diagram{width:100%;height:260px;background:repeating-linear-gradient(0deg,#111 0 20px,#151515 20px 40px);border:1px dashed #444;display:flex;align-items:center;justify-content:center;color:#666;font-family:monospace}
.badge{display:inline-block;padding:3px 8px;background:#222;border:1px solid #444;border-radius:4px;font-size:11px;margin-right:5px}
</style>
</head>
